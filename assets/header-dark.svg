<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Seoktae Lee — I ship apps, and I run the servers behind them. Client to NGINX to API to DB request flow.">
  <defs>
    <clipPath id="box"><rect width="1200" height="250" rx="10"/></clipPath>
    <style>
      /* 기본 상태 = 정지 화면으로도 완결된 다이어그램.
         애니메이션이 안 도는 환경에서도 그림이 깨지지 않게 한다. */
      @keyframes rise   { from { opacity: 0; transform: translateY(10px); } }
      @keyframes appear { from { opacity: 0; } }
      @keyframes travel {
        0%   { transform: translateX(0);     opacity: 0; }
        7%   { transform: translateX(0);     opacity: 1; }
        45%  { transform: translateX(450px); opacity: 1; }
        53%  { transform: translateX(450px); opacity: 0; }
        100% { transform: translateX(450px); opacity: 0; }
      }
      @keyframes halo {
        0%   { opacity: 0; }
        4%   { opacity: .22; }
        14%  { opacity: .22; }
        26%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes ok {
        0%   { opacity: 0; transform: translateY(5px); }
        7%   { opacity: 1; transform: none; }
        52%  { opacity: 1; transform: none; }
        66%  { opacity: 0; transform: none; }
        100% { opacity: 0; }
      }

      .grid { animation: appear .9s ease-out .05s backwards; }
      .name { animation: rise .8s cubic-bezier(.22,.9,.3,1) .05s backwards; }
      .tag  { animation: rise .8s cubic-bezier(.22,.9,.3,1) .22s backwards; }
      .chip1{ animation: rise .8s cubic-bezier(.22,.9,.3,1) .38s backwards; }
      .chip2{ animation: rise .8s cubic-bezier(.22,.9,.3,1) .48s backwards; }
      .flow { animation: appear 1s ease-out .5s backwards; }

      .pkt  { animation: travel 4s linear .9s infinite backwards; }
      .h1   { animation: halo 4s linear .90s infinite backwards; }
      .h2   { animation: halo 4s linear 1.43s infinite backwards; }
      .h3   { animation: halo 4s linear 1.96s infinite backwards; }
      .h4   { animation: halo 4s linear 2.49s infinite backwards; }
      .ok   { animation: ok   4s linear 2.60s infinite backwards; }

      @media (prefers-reduced-motion: reduce) {
        .grid,.name,.tag,.chip1,.chip2,.flow,.pkt,.h1,.h2,.h3,.h4,.ok { animation: none; }
        .pkt { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#box)">
    <rect width="1200" height="250" fill="#0D1117"/>

    <g class="grid" stroke="#22302A" stroke-width="1" opacity=".45">
      <line x1="0" y1="58"  x2="1200" y2="58"/>
      <line x1="0" y1="116" x2="1200" y2="116"/>
      <line x1="0" y1="174" x2="1200" y2="174"/>
      <line x1="0" y1="232" x2="1200" y2="232"/>
    </g>

    <text class="name" x="70" y="128" font-family="Georgia, 'Times New Roman', 'Nimbus Roman', serif"
          font-size="70" font-weight="700" letter-spacing="-1" fill="#E9F2EC">Seoktae Lee</text>
    <text class="tag" x="73" y="167" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="19" fill="#87998F">I ship apps &#8212; and I run the servers behind them.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing=".6">
      <g class="chip1">
        <rect x="72" y="190" width="152" height="30" rx="15" fill="#10241B" stroke="#22302A"/>
        <text x="148" y="209.5" fill="#E9F2EC" text-anchor="middle">3 SERVERS RUN</text>
      </g>
      <g class="chip2">
        <rect x="236" y="190" width="204" height="30" rx="15" fill="#10241B" stroke="#22302A"/>
        <text x="338" y="209.5" fill="#E9F2EC" text-anchor="middle">iOS / ANDROID / WEB</text>
      </g>
    </g>

    <!-- ── 요청 흐름 ────────────────────────────────── -->
    <g class="flow">
      <!-- 활성 헤일로 -->
      <g fill="#35B37B">
        <circle class="h1" cx="680"  cy="130" r="24" opacity="0"/>
        <circle class="h2" cx="830"  cy="130" r="24" opacity="0"/>
        <circle class="h3" cx="980"  cy="130" r="24" opacity="0"/>
        <circle class="h4" cx="1130" cy="130" r="24" opacity="0"/>
      </g>

      <!-- 연결선 -->
      <g stroke="#35B37B" stroke-width="1.6" opacity=".38">
        <line x1="697" y1="130" x2="813" y2="130"/>
        <line x1="847" y1="130" x2="963" y2="130"/>
        <line x1="997" y1="130" x2="1113" y2="130"/>
      </g>

      <!-- 노드 -->
      <g fill="#0D1117" stroke="#35B37B" stroke-width="1.8">
        <circle cx="680" cy="130" r="13"/>
        <rect x="814" y="115" width="32" height="30" rx="8"/>
        <rect x="964" y="115" width="32" height="30" rx="8"/>
        <path d="M1117 119 v22 a13 5 0 0 0 26 0 v-22" />
        <ellipse cx="1130" cy="119" rx="13" ry="5"/>
      </g>

      <!-- 라벨 -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace"
         font-size="10.5" letter-spacing="1.6" fill="#87998F" text-anchor="middle">
        <text x="680"  y="166">CLIENT</text>
        <text x="830"  y="166">NGINX</text>
        <text x="980"  y="166">NODE API</text>
        <text x="1130" y="166">DB</text>
      </g>

      <!-- 200 OK -->
      <g class="ok" opacity="1">
        <rect x="1085" y="74" width="80" height="24" rx="12" fill="#10241B" stroke="#35B37B" stroke-width="1.1"/>
        <text x="1125" y="90.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace"
              font-size="11.5" letter-spacing=".8" fill="#35B37B" text-anchor="middle">200 OK</text>
      </g>

      <!-- 이동하는 요청 -->
      <g class="pkt" opacity="0">
        <circle cx="680" cy="130" r="10" fill="#35B37B" opacity=".18"/>
        <circle cx="680" cy="130" r="4.5" fill="#35B37B"/>
      </g>
    </g>
  </g>
</svg>
