<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Seoktae Lee — I ship apps, and I run the servers behind them.">
  <defs>
    <clipPath id="box"><rect width="1200" height="250" rx="10"/></clipPath>
    <style>
      /* 기본값은 '완성 상태'로 두고 backwards 채움으로 되감는다.
         애니메이션이 안 도는 환경에서도 그림이 온전히 보이게 하기 위함. */
      @keyframes draw   { from { stroke-dashoffset: 1; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(10px); } }
      @keyframes appear { from { opacity: 0; } }
      @keyframes pop    { from { opacity: 0; transform: scale(.3); } }
      @keyframes ping   { 0%   { opacity: .35; transform: scale(1); }
                          70%  { opacity: 0;   transform: scale(1.9); }
                          100% { opacity: 0;   transform: scale(1.9); } }

      .grid   { animation: appear .9s ease-out    .05s backwards; }
      .curve  { stroke-dasharray: 1; stroke-dashoffset: 0;
                animation: draw 1.7s cubic-bezier(.25,.85,.3,1) .15s backwards; }
      .tick   { animation: appear .8s ease-out    1.35s backwards; }
      .dot    { transform-box: fill-box; transform-origin: center;
                animation: pop .5s cubic-bezier(.2,1.5,.4,1) 1.6s backwards; }
      .ping   { transform-box: fill-box; transform-origin: center;
                animation: ping 2.8s ease-out 2.1s infinite backwards; }
      .name   { animation: rise .8s cubic-bezier(.22,.9,.3,1) .05s backwards; }
      .tag    { animation: rise .8s cubic-bezier(.22,.9,.3,1) .22s backwards; }
      .chip1  { animation: rise .8s cubic-bezier(.22,.9,.3,1) .38s backwards; }
      .chip2  { animation: rise .8s cubic-bezier(.22,.9,.3,1) .48s backwards; }

      @media (prefers-reduced-motion: reduce) {
        .grid,.curve,.tick,.dot,.ping,.name,.tag,.chip1,.chip2 { animation: none; }
        .ping { opacity: .3; }
      }
    </style>
  </defs>

  <g clip-path="url(#box)">
    <rect width="1200" height="250" fill="#FFFFFF"/>

    <g class="grid" stroke="#DBE4DE" stroke-width="1" opacity=".45">
      <line x1="0" y1="58"  x2="1200" y2="58"/>
      <line x1="0" y1="116" x2="1200" y2="116"/>
      <line x1="0" y1="174" x2="1200" y2="174"/>
      <line x1="0" y1="232" x2="1200" y2="232"/>
    </g>

    <g fill="none" stroke="#12603F" stroke-linecap="round">
      <path class="curve" pathLength="1" d="M660 236 C 820 236, 912 188, 986 118 C 1042 64, 1090 40, 1140 30" stroke-width="2.6" opacity=".92"/>
      <path class="curve" pathLength="1" d="M660 236 C 820 236, 912 188, 986 118 C 1042 64, 1090 40, 1140 30" stroke-width="11" opacity=".09"/>
    </g>

    <g class="tick" stroke="#12603F" stroke-width="1.2" opacity=".26">
      <line x1="986" y1="118" x2="986" y2="232"/>
      <line x1="1140" y1="30" x2="1140" y2="232"/>
    </g>

    <circle class="ping" cx="1140" cy="30" r="14" fill="none" stroke="#12603F" stroke-width="1.4" opacity="0"/>
    <circle class="dot"  cx="1140" cy="30" r="5.5" fill="#12603F"/>

    <text class="name" x="70" y="128" font-family="Georgia, 'Times New Roman', 'Nimbus Roman', serif"
          font-size="70" font-weight="700" letter-spacing="-1" fill="#12201A">Seoktae Lee</text>

    <text class="tag" x="73" y="167" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="19" fill="#546259">I ship apps &#8212; and I run the servers behind them.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing=".6">
      <g class="chip1">
        <rect x="72" y="190" width="152" height="30" rx="15" fill="#F2F7F4" stroke="#DBE4DE"/>
        <text x="148" y="209.5" fill="#12201A" text-anchor="middle">3 SERVERS RUN</text>
      </g>
      <g class="chip2">
        <rect x="236" y="190" width="204" height="30" rx="15" fill="#F2F7F4" stroke="#DBE4DE"/>
        <text x="338" y="209.5" fill="#12201A" text-anchor="middle">iOS / ANDROID / WEB</text>
      </g>
    </g>
  </g>
</svg>
